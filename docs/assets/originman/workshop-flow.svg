<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="状态进入固定反馈和RL，两者叠加后经过限幅驱动仿真，物理状态回到观察输入"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#496a70"/></marker></defs><rect width="1200" height="470" rx="20" fill="#f0f6f4"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#173a41"><text x="600" y="44" font-size="27" font-weight="bold">稳定反馈打底，RL学习连续髋踝修正</text><rect x="30" y="150" width="210" height="110" rx="14" fill="#dae8e5"/><text x="135" y="193" font-size="23">14维本体状态</text><text x="135" y="227" font-size="17">姿态、角速度、关节等</text><rect x="320" y="90" width="230" height="90" rx="14" fill="#dae8e5"/><text x="435" y="129" font-size="23">固定基础PD反馈</text><text x="435" y="157" font-size="17">参数不由RL更新</text><rect x="320" y="235" width="230" height="100" rx="14" fill="#167d83"/><text x="435" y="277" font-size="23" fill="white">训练得到的SAC策略</text><text x="435" y="309" font-size="17" fill="white">每20ms输出两个修正</text><rect x="640" y="150" width="220" height="110" rx="14" fill="#dae8e5"/><text x="750" y="192" font-size="23">叠加与约束</text><text x="750" y="225" font-size="17">映射、限幅、变化率</text><rect x="940" y="150" width="230" height="110" rx="14" fill="#dae8e5"/><text x="1055" y="192" font-size="23">OriginMan仿真</text><text x="1055" y="225" font-size="17">执行目标，产生新状态</text><text x="600" y="434" font-size="19">扰动力与施力时钟不输入策略；真机观测和执行链另行验证</text></g><g fill="none" stroke="#496a70" stroke-width="3" marker-end="url(#arrow)"><path d="M240 185 L280 185 L280 135 L315 135"/><path d="M240 225 L280 225 L280 285 L315 285"/><path d="M550 135 L590 135 L590 180 L635 180"/><path d="M550 285 L590 285 L590 230 L635 230"/><path d="M860 205 L935 205"/><path d="M1055 260 L1055 380 L135 380 L135 265"/></g></svg>