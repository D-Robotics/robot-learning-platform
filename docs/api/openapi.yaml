openapi: 3.1.0
info:
  title: RDK Robot Learning Platform API
  version: 1.0.0
  description: >-
    Versioned control-plane contract for the standalone MicroDuck/RDK Duck
    Sim2Real workflow. The legacy /api/sim2real paths are aliases.
servers:
  - url: https://example.invalid
    description: Replace with the deployment origin.
tags:
  - name: service
  - name: sso
  - name: workspace
  - name: runs
  - name: telemetry
  - name: deployments
  - name: devices
  - name: board-station
  - name: agent
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      tags: [service]
      summary: Liveness and dependency summary
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is alive (it may be degraded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [service]
      summary: Readiness probe
      operationId: getReadiness
      security: []
      responses:
        "200": { $ref: "#/components/responses/Ready" }
        "503": { $ref: "#/components/responses/NotReady" }
  /api/sso/session:
    get:
      tags: [sso]
      summary: Current cookie identity or an auth-required challenge
      operationId: getSsoSession
      security: []
      description: >-
        Returns 200 with the identity when the site-wide Studio session cookie
        is present and valid, otherwise 401 with login-relay availability
        (loginRelay.configured and optionally loginRelay.loginPageUrl) so the
        workbench can render a direct login form or a redirect.
      responses:
        "200":
          description: Verified identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoSessionResponse" }
        "401":
          description: >-
            No valid session; body carries loginRelay availability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/sso/login:
    post:
      tags: [sso]
      summary: Relay credentials to the Studio account center and adopt its cookie
      operationId: ssoLogin
      security: []
      description: >-
        Relays a whitelist of login fields to POST /api/sso/direct/login on
        the Studio main shell, then adopts only the web-cloud session cookie
        it can verify (legacy cookies are dropped). In same-origin
        deployments nginx may route the browser directly to the Studio shell
        instead, in which case this endpoint is unused. Failed by
        sim2RealCsrfMiddleware for cross-site submissions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoLoginRequest" }
      responses:
        "200":
          description: Login accepted; session cookie set on the response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoSessionResponse" }
        "400": { description: Login method missing or not in account/sms/email. }
        "409": { description: Credentials rejected by the account center. }
        "502": { description: Relay transport failure or unusable cookie. }
        "503": { description: Cookie secret or relay target not configured. }
  /api/sso/logout:
    post:
      tags: [sso]
      summary: Clear the shared session cookie
      operationId: ssoLogout
      security: []
      description: Expires the site-wide session cookie for this service only.
      responses:
        "200":
          description: Cookie cleared.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
  /api/v1/duck/task-packs/{taskId}/failure-cases:
    get:
      tags: [workspace]
      summary: Read the public seed failure-case pack for a task pack
      description: >
        Public, immutable seed assets for the first task-pack flywheel. Only
        goal-navigation-clear-arena is served today; the route is
        unauthenticated so demos can cite it without credentials.
      operationId: getTaskPackFailureCases
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Failure-case seed entries, content: { application/json: { schema: { type: object } } } }
        "404": { description: "Unknown task pack: { ok: false, error: TASK_PACK_NOT_FOUND }" }
        "503": { description: "Seed asset unavailable: { ok: false, error: TASK_PACK_ASSET_UNAVAILABLE }" }
  /api/v1/duck/overview:
    get:
      tags: [workspace]
      summary: Read the account-scoped workspace snapshot
      operationId: getOverview
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Products, contracts, models, runs, devices and integrations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverviewResponse" }
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/duck/workspace-summary:
    get:
      tags: [workspace]
      summary: Read a lightweight workspace summary
      operationId: getWorkspaceSummary
      description: >-
        Returns account-scoped counts and the latest run/deployment projection
        for dashboards and assistants. It intentionally omits model manifests,
        telemetry layouts and integration probes so it is safe to poll often.
      responses:
        "200":
          description: Lightweight workspace summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummaryResponse"
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/duck/audit:
    get:
      tags: [workspace]
      summary: Read the owner-scoped mutation audit trail
      operationId: listAuditEvents
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 2000, default: 200 }
        - in: query
          name: resourceType
          schema: { type: string, maxLength: 80 }
        - in: query
          name: outcome
          schema: { type: string, enum: [succeeded, failed, denied] }
      responses:
        "200": { description: Audit events, content: { application/json: { schema: { $ref: "#/components/schemas/AuditResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/duck/audit/health:
    get:
      tags: [workspace]
      summary: Check audit stream availability
      operationId: getAuditHealth
      responses:
        "200": { description: Audit health, content: { application/json: { schema: { $ref: "#/components/schemas/AuditHealthResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/duck/projects:
    get:
      tags: [workspace]
      summary: List account-scoped learning projects
      operationId: listProjects
      responses:
        "200": { description: Projects, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectsResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
    post:
      tags: [workspace]
      summary: Create a learning project
      operationId: createProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Duplicate slug. }
  /api/v1/duck/projects/{id}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [workspace]
      summary: Read a project with linked datasets and runs
      operationId: getProject
      responses:
        "200": { description: Project detail, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectDetailResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [workspace]
      summary: Update project metadata and asset links
      operationId: updateProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectInput" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/duck/projects/{id}/runs/compare:
    get:
      tags: [runs]
      summary: Compare experiment runs in a project
      operationId: compareProjectRuns
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: runIds
          schema: { type: string, maxLength: 1024 }
          description: Comma-separated run ids; omitted returns the latest 20.
      responses:
        "200": { description: Comparison rows, content: { application/json: { schema: { $ref: "#/components/schemas/RunComparisonResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/duck/datasets:
    get:
      tags: [workspace]
      summary: List dataset metadata references
      operationId: listDatasets
      responses:
        "200": { description: Datasets, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetsResponse" } } } }
    post:
      tags: [workspace]
      summary: Register a dataset metadata reference
      operationId: createDataset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DatasetInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/duck/models/validate:
    post:
      tags: [workspace]
      summary: Validate a manifest without persisting it
      operationId: validateModelManifest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManifestEnvelope" }
      responses:
        "200":
          description: Validation result (valid may be false).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResponse" }
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/duck/models:
    get:
      tags: [workspace]
      summary: List account-scoped model manifests
      operationId: listModels
      responses:
        "200":
          description: Registered models, including the built-in MicroDuck contract.
          content:
            application/json:
              schema:
                type: object
                required: [ok, models]
                properties:
                  ok: { const: true }
                  models: { type: array, items: { $ref: "#/components/schemas/Model" } }
        "401": { $ref: "#/components/responses/AuthRequired" }
    post:
      tags: [workspace]
      summary: Register an immutable model manifest
      operationId: createModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManifestEnvelope" }
      responses:
        "201":
          description: Model registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Model version already exists. }
  /api/v1/duck/models/{modelId}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      tags: [workspace]
      summary: Read one registered model
      operationId: getModel
      responses:
        "200":
          description: Model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/duck/runs:
    get:
      tags: [runs]
      summary: List account-scoped runs
      operationId: listRuns
      responses:
        "200":
          description: Recent runs with product and contract provenance.
          content:
            application/json:
              schema:
                type: object
                required: [ok, runs]
                properties:
                  ok: { const: true }
                  runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
        "401": { $ref: "#/components/responses/AuthRequired" }
    post:
      tags: [runs]
      summary: Start or register a browser, local, RoboGo or contract run
      operationId: createRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "201":
          description: New run.
          content: { application/json: { schema: { $ref: "#/components/schemas/RunResponse" } } }
        "200":
          description: Idempotent replay.
          content: { application/json: { schema: { $ref: "#/components/schemas/RunResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "429": { description: Per-account active-run quota reached. }
  /api/v1/duck/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      summary: Read a run and refresh remote status when applicable
      operationId: getRun
      responses:
        "200":
          description: Run.
          content: { application/json: { schema: { $ref: "#/components/schemas/RunResponse" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Status lookup is retryable; last known state is preserved. }
  /api/v1/duck/runs/{runId}/reconcile:
    post:
      tags: [runs]
      summary: Attach a confirmed external id without relaunching work
      operationId: reconcileRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalRunId, confirm]
              properties:
                externalRunId: { type: string }
                confirm: { const: true }
      responses:
        "200":
          description: Reconciled run.
          content: { application/json: { schema: { $ref: "#/components/schemas/RunResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Run is not reconcilable or the id does not match. }
  /api/v1/duck/runs/{runId}/policy.onnx:
    get:
      tags: [runs]
      summary: Download the completed run's ONNX policy bytes for the browser trial
      operationId: getRunPolicyOnnx
      description: >-
        Serves the digest-verified ONNX artifact of a completed, real (non-mock)
        local run so the browser trial runs the exact bytes that would be
        staged to a board. The browser trial is an operator aid and never
        release evidence. The response carries the worker-recomputed
        X-Artifact-Sha256 header and is rejected when it diverges from the
        ledger's recorded digest.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: ONNX policy bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { description: Run not found or not owned by the account. }
        "409":
          description: >-
            Trial not available: run unfinished, mock, wrong backend, no ONNX
            artifact, artifact bytes unreadable, or digest mismatch
            (SIM2REAL_POLICY_TRIAL_*).
  /api/v1/duck/telemetry:
    post:
      tags: [telemetry]
      summary: Append one ordered telemetry chunk
      operationId: appendTelemetry
      security:
        - cookieAuth: []
        - telemetryBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetryRequest" }
      responses:
        "201":
          description: Chunk accepted.
          content: { application/json: { schema: { $ref: "#/components/schemas/TelemetryResponse" } } }
        "200":
          description: Idempotent replay.
          content: { application/json: { schema: { $ref: "#/components/schemas/TelemetryResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { description: Telemetry quota exceeded. }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { description: Bearer attestation owner, binding, or source mismatch. }
        "409": { description: Idempotency or telemetry sequence conflict. }
  /api/v1/duck/runs/{runId}/telemetry:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [telemetry]
      summary: List accepted telemetry chunks
      operationId: listTelemetry
      responses:
        "200":
          description: Telemetry chunks.
          content: { application/json: { schema: { $ref: "#/components/schemas/TelemetryListResponse" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [telemetry]
      summary: Append a chunk using the run id in the path
      operationId: appendRunTelemetry
      security:
        - cookieAuth: []
        - telemetryBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetryRequestWithoutRunId" }
      responses:
        "201":
          description: Chunk accepted.
          content: { application/json: { schema: { $ref: "#/components/schemas/TelemetryResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { description: Bearer attestation owner, binding, or source mismatch. }
        "409": { description: Idempotency or telemetry sequence conflict. }
  /api/v1/duck/runs/{runId}/replay:
    get:
      tags: [telemetry]
      summary: Read the replay summary
      operationId: getReplay
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Replay and evaluation summary.
          content: { application/json: { schema: { $ref: "#/components/schemas/ReplayResponse" } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/duck/runs/{runId}/retraining-advice:
    get:
      tags: [telemetry]
      summary: Read-only drift analysis and optional retraining suggestion
      description: >-
        Analyzes board telemetry drift (action MAE, done ratio, stale
        observation ratio) and returns an advisory verdict plus a pre-filled
        training request when retraining is recommended. Read-only: the
        flywheel never submits a run; the operator must POST /runs explicitly.
      operationId: getRetrainingAdvice
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Advisory verdict, per-signal evidence, and optional suggested training request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  advice:
                    type: object
                    properties:
                      verdict: { type: string, enum: [retrain-recommended, healthy, insufficient-evidence] }
                      checkedAt: { type: string, format: date-time }
                      runId: { type: string }
                      taskId: { type: string }
                      boardSamples: { type: integer, minimum: 0 }
                      summary: { type: string }
                      note: { type: string }
                      signals:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            label: { type: string }
                            value: { type: [number, "null"] }
                            threshold: { type: number }
                            breached: { type: boolean }
                            evidence: { type: string }
                      suggestedTraining:
                        type: object
                        description: Present only on retrain-recommended; a request body for the operator to submit, never auto-fired.
                        properties:
                          taskId: { type: string }
                          backend: { type: string, enum: [local] }
                          training:
                            type: object
                            properties:
                              profile: { type: string }
                              algorithm: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/duck/runs/{runId}/board-sessions:
    get:
      tags: [telemetry]
      summary: Reconstruct board policy sessions from lifecycle events
      description: >-
        Aggregates the session-started / session-stopped lifecycle markers
        carried in board-agent telemetry chunks into one summary per policy
        motion session: start/stop times, stop reason, inference statistics,
        and the model fingerprint that was active. A session whose stop marker
        never arrived (process killed mid-motion) keeps an absent stoppedAt
        and is reported as interrupted, never as a clean stop. Sessions are
        attested only when every contributing chunk was server-attested;
        otherwise they are review-only evidence.
      operationId: listBoardSessions
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Board sessions reconstructed from accepted telemetry chunks.
          content:
            application/json:
              schema:
                type: object
                required: [ok, runId, sessions, count]
                properties:
                  ok: { const: true }
                  runId: { type: string }
                  count: { type: integer, minimum: 0 }
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/BoardSessionSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/duck/runs/{runId}/evaluate:
    post:
      tags: [telemetry]
      summary: Evaluate accepted telemetry against an optional reference
      operationId: evaluateRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                referenceSamples: { type: array, maxItems: 5000, items: { $ref: "#/components/schemas/TelemetrySample" } }
                referenceJsonl: { type: string, maxLength: 2000000 }
      responses:
        "200":
          description: Evaluation.
          content: { application/json: { schema: { $ref: "#/components/schemas/EvaluationResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/sim2real/agent/plan:
    post:
      tags: [agent]
      summary: Parse a Chinese task into a guarded Sim2Real tool plan
      operationId: createSim2RealAgentPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                context: { type: object, additionalProperties: true }
      responses:
        "200": { description: Agent plan. }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/sim2real/agent/execute:
    post:
      tags: [agent]
      summary: Start an asynchronous guarded Agent run
      operationId: executeSim2RealAgentPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: object, additionalProperties: true }
                approved: { type: boolean, default: false }
      responses:
        "202": { description: Run accepted. }
        "409": { description: Explicit approval required. }
        "429": { description: Per-account or process-wide active Agent run quota reached; retry after completion. }
  /api/sim2real/agent/runs/{runId}:
    get:
      tags: [agent]
      summary: Read Agent run status, tool events and evidence
      operationId: getSim2RealAgentRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200": { description: Agent run snapshot. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/sim2real/agent/capabilities:
    get:
      tags: [agent]
      summary: Discover the capabilities exposed by this deployment
      operationId: listSim2RealAgentCapabilities
      security: []
      description: >-
        Public metadata for clients that need to render the Agent surface. The
        legacy planner atoms and the DSH catalog are reported separately;
        `dsh.capabilities[].bound` is false when a deployment has not supplied a real
        product handler. Discovery never grants permission to execute an
        operation.
      responses:
        "200":
          description: Capability catalogs and runtime state.
          content:
            application/json:
              schema:
                type: object
                required: [ok, runtime, capabilities, dsh]
                properties:
                  ok: { const: true }
                  runtime: { type: string, enum: [legacy, dsh, dsh-configured] }
                  capabilities:
                    type: array
                    items:
                      type: object
                      required: [id, description, readOnly]
                      properties:
                        id: { type: string }
                        description: { type: string }
                        readOnly: { type: boolean }
                  dsh:
                    type: object
                    required: [configured, initialized, capabilities]
                    properties:
                      configured: { type: boolean }
                      initialized: { type: boolean }
                      capabilities:
                        type: array
                        items:
                          type: object
                          required: [id, description, readOnly, bound]
                          properties:
                            id: { type: string }
                            description: { type: string }
                            readOnly: { type: boolean }
                            bound: { type: boolean }
  /api/sim2real/dsh/chat:
    post:
      tags: [agent]
      summary: Send one prompt to the deployment-owned DSH runtime
      operationId: askSim2RealDsh
      description: >-
        Authenticated execution endpoint. The runtime is available only when
        `RDK_SIM2REAL_DSH_RUNTIME` is enabled and its provider is configured;
        product capability handlers remain deployment-owned. The service
        returns a bounded session event tail for diagnostics and never exposes
        provider transport errors verbatim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 12000 }
                model: { type: string, minLength: 1, maxLength: 160, pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,159}$" }
      responses:
        "200":
          description: DSH response and session evidence.
          content:
            application/json:
              schema:
                type: object
                required: [ok, sessionId, text, events]
                properties:
                  ok: { const: true }
                  sessionId: { type: string }
                  text: { type: string, maxLength: 20000 }
                  events:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [type]
                      additionalProperties: false
                      properties:
                        type: { type: string, maxLength: 80 }
                        at: { type: string, maxLength: 80 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { description: Account lacks the Agent permission. }
        "502": { description: DSH provider or runtime failure (generic, retryable). }
        "503": { description: DSH runtime is not enabled on this deployment. }
  /api/v1/duck/deployments:
    get:
      tags: [deployments]
      summary: List account-scoped deployment plans
      operationId: listDeployments
      responses:
        "200":
          description: Recent deployment plans.
          content:
            application/json:
              schema:
                type: object
                required: [ok, deployments]
                properties:
                  ok: { const: true }
                  deployments: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
        "401": { $ref: "#/components/responses/AuthRequired" }
    post:
      tags: [deployments]
      summary: Create a preflight, canary or live deployment plan
      operationId: createDeployment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentRequest" }
      responses:
        "201":
          description: Deployment plan.
          content: { application/json: { schema: { $ref: "#/components/schemas/DeploymentResponse" } } }
        "200":
          description: Idempotent replay.
          content: { application/json: { schema: { $ref: "#/components/schemas/DeploymentResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Board detection, compatibility, or release-evidence gate is not satisfied. }
  /api/v1/duck/deployments/{deploymentId}:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      tags: [deployments]
      summary: Read a deployment plan
      operationId: getDeployment
      responses:
        "200":
          description: Deployment.
          content: { application/json: { schema: { $ref: "#/components/schemas/DeploymentResponse" } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/duck/deployments/{deploymentId}/cancel:
    post:
      tags: [deployments]
      summary: Cancel a deployment plan before board action
      operationId: cancelDeployment
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      responses:
        "200":
          description: Cancelled plan.
          content: { application/json: { schema: { $ref: "#/components/schemas/DeploymentResponse" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Plan is no longer cancellable. }
  /api/v1/duck/deployments/{deploymentId}/history:
    get:
      tags: [deployments]
      summary: Read deployment lifecycle history and verification evidence
      operationId: getDeploymentHistory
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      responses:
        "200":
          description: Append-only lifecycle events and latest verification.
          content:
            application/json:
              schema:
                type: object
                required: [ok, deploymentId, history, verification]
                properties:
                  ok: { const: true }
                  deploymentId: { type: string }
                  history: { type: array, items: { type: object, additionalProperties: true } }
                  verification: { type: [object, "null"], additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/duck/deployments/{deploymentId}/approval:
    post:
      tags: [deployments]
      summary: Record the human approval decision for a canary/live plan
      operationId: decideDeploymentApproval
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [approved, rejected] }
                approved: { type: boolean, description: Legacy boolean alias for decision. }
                note: { type: string, maxLength: 500 }
              anyOf:
                - required: [decision]
                - required: [approved]
      responses:
        "200":
          description: Updated approval state; ready plans still require a board-agent executor.
          content: { application/json: { schema: { $ref: "#/components/schemas/DeploymentResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Evidence gate, compatibility, or lifecycle state does not permit the decision. }
  /api/v1/duck/deployments/{deploymentId}/version-switch:
    post:
      tags: [deployments]
      summary: Create a guarded preflight plan for another model version
      operationId: switchDeploymentVersion
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetModelId]
              properties:
                targetModelId: { type: string }
      responses:
        "201":
          description: New preflight plan.
          content: { application/json: { schema: { $ref: "#/components/schemas/DeploymentResponse" } } }
        "200":
          description: Idempotent replay.
          content: { application/json: { schema: { $ref: "#/components/schemas/DeploymentResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Target model is invalid or incompatible. }
  /api/v1/duck/deployments/{deploymentId}/preflight:
    post:
      tags: [deployments]
      summary: Execute the fixed read-only board preflight
      operationId: runPreflight
      parameters:
        - $ref: "#/components/parameters/DeploymentId"
      responses:
        "200":
          description: Real read-only preflight passed.
          content: { application/json: { schema: { $ref: "#/components/schemas/PreflightResponse" } } }
        "409": { description: Preflight failed or a mock agent was used; actuator action is not attempted. }
        "503": { description: Board agent unavailable. }
  /api/devices/{deviceId}/board/detect:
    post:
      tags: [devices]
      summary: Probe and optionally persist board passport metadata
      operationId: detectBoard
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - in: query
          name: persist
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Board passport result.
          content: { application/json: { schema: { $ref: "#/components/schemas/BoardDetectResponse" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Board agent unavailable. }
  /api/v1/duck/board-station/policy:
    get:
      tags: [board-station]
      summary: Read board policy runtime state
      operationId: getBoardStationPolicy
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        "200":
          description: Policy runtime state and platform gates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardPolicyResponse" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Board agent unreachable. }
  /api/v1/duck/board-station/onboarding/preflight:
    get:
      tags: [board-station]
      summary: Read the structured board onboarding preflight passport
      operationId: getBoardStationOnboardingPreflight
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        "200":
          description: Structured read-only board passport.
          content:
            application/json:
              schema:
                type: object
                required: [ok, deviceId, passport]
                properties:
                  ok: { type: boolean }
                  deviceId: { type: string }
                  passport: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Board agent unreachable. }
  /api/v1/duck/local-bridge/status:
    get:
      tags: [devices]
      summary: Read the current Local Bridge discovery status
      operationId: getLocalBridgeStatus
      responses:
        "200":
          description: Bridge sessions and discovered devices.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/duck/local-bridge/pairing-code:
    post:
      tags: [devices]
      summary: Create a short-lived Local Bridge pairing command
      operationId: createLocalBridgePairingCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Pairing command created. }
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/duck/local-bridge/devices/{bridgeDeviceId}/connect:
    post:
      tags: [devices]
      summary: Register a discovered Local Bridge device in Sim2Real
      operationId: connectLocalBridgeDevice
      parameters:
        - in: path
          name: bridgeDeviceId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Device connected and registered. }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Bridge device registration failed. }
  /api/v1/duck/board-station/policy/files:
    get:
      tags: [board-station]
      summary: List staged policy files in the board policies directory
      operationId: listBoardStationPolicyFiles
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        "200":
          description: Read-only listing of the pinned board policies directory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  policies:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        bytes: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "502": { description: Board agent unreachable. }
  /api/v1/duck/board-station/policy/stage:
    post:
      tags: [board-station]
      summary: Stage a training artifact into the board policies directory
      description: >-
        Three-hop evidence chain: fetches the run's policy.onnx bytes from the
        training worker, cross-checks the SHA-256 against the run ledger, and
        forwards to the board agent which verifies the digest again before an
        atomic write. Staging only writes the file — it never loads the model
        and never moves the robot; loading and starting stay separate explicit
        operator actions.
      operationId: stageBoardStationPolicy
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runId]
              properties:
                runId: { type: string, pattern: "^[\\w.-]{1,120}$" }
                filename:
                  type: string
                  description: Optional bare filename; defaults to <runId>.onnx.
                  pattern: "^[\\w.-]+\\.onnx$"
      responses:
        "200":
          description: Artifact staged into the board policies directory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  staged: { type: boolean }
                  path: { type: string }
                  bytes: { type: integer, minimum: 0 }
                  sha256: { type: string }
                  policies:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        bytes: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Platform policy gate disabled, run not staged-eligible (mock,
            not completed, wrong backend/format, missing digest), artifact
            unavailable, digest mismatch, or filename conflict.
        "501": { description: Run artifact fetching is not wired on this deployment. }
        "502": { description: Board agent unreachable. }
  /api/v1/duck/board-station/policy/load:
    post:
      tags: [board-station]
      summary: Load an allowlisted ONNX policy from the board policies directory
      operationId: loadBoardStationPolicy
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, pattern: "^[\\w.-]+\\.onnx$" }
      responses:
        "200": { description: Policy loaded. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Platform policy gate is disabled. }
        "502": { description: Board agent unreachable. }
  /api/v1/duck/board-station/policy/start:
    post:
      tags: [board-station]
      summary: Start constrained policy motion after all gates are enabled
      operationId: startBoardStationPolicy
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: { type: number, minimum: -1, maximum: 1 }
      responses:
        "200": { description: Policy motion started. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: One or more safety gates are disabled. }
        "502": { description: Board agent unreachable. }
  /api/v1/duck/board-station/policy/reset:
    post:
      tags: [board-station]
      summary: Reset a sticky policy runtime fault
      operationId: resetBoardStationPolicy
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        "200": { description: Policy fault reset. }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Platform policy gate is disabled. }
        "502": { description: Board agent unreachable. }
  /api/v1/duck/board-station/policy/stop:
    post:
      tags: [board-station]
      summary: Stop policy motion and publish zero output
      operationId: stopBoardStationPolicy
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        "200": { description: Policy stopped. }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Board agent unreachable; watchdog remains active. }
  /api/v1/duck/board-station/health:
    get:
      tags: [board-station]
      summary: Station capability probe for the workbench
      operationId: getBoardStationHealth
      description: >-
        Returns the resolved station target device plus the agent's honest
        capability snapshot (capabilities, stationCommands, actuatorControl,
        mock, cameraSupported). Fails closed with 503 when no board agent is
        configured.
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
          description: Optional explicit station target; defaults to the first visible device.
      responses:
        "200":
          description: Station health and capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationHealthResponse" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Board agent unreachable (retryable). }
        "503": { description: Board agent not configured. }
  /api/v1/duck/board-station/status:
    get:
      tags: [board-station]
      summary: One board status snapshot (CPU, memory, power, TROS topics)
      operationId: getBoardStationStatus
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        "200":
          description: Status snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok: { const: true }
                  status: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Board agent unreachable (retryable). }
        "503": { description: Board agent not configured. }
  /api/v1/duck/board-station/status/stream:
    get:
      tags: [board-station]
      summary: Forwarded NDJSON status heartbeat
      operationId: getBoardStationStatusStream
      description: >-
        Streams NDJSON status frames from the agent through the authenticated
        proxy; one upstream connection per client, torn down together, with a
        bounded lifetime.
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        "200":
          description: NDJSON stream (content-type application/x-ndjson).
          content: { application/x-ndjson: { schema: { type: object, additionalProperties: true } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Board agent stream unreachable (retryable). }
        "503": { description: Board agent not configured. }
  /api/v1/duck/board-station/camera.mjpeg:
    get:
      tags: [board-station]
      summary: Forwarded MJPEG camera stream
      operationId: getBoardStationCamera
      description: >-
        Forwards the board camera MJPEG stream; rendered directly by a plain
        img tag in the workbench. The agent reports 503 (not synthetic
        frames) when no camera is connected.
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        "200":
          description: MJPEG stream (multipart/x-mixed-replace).
          content:
            multipart/x-mixed-replace:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Board agent stream unreachable (retryable). }
        "503": { description: Board agent not configured or camera absent. }
  /api/v1/duck/board-station/commands:
    post:
      tags: [board-station]
      summary: Dispatch one allowlisted read-only station command
      operationId: postBoardStationCommand
      description: >-
        Accepts only the four read-only station commands
        (list-tros-nodes, list-tros-topics, disk-usage, service-status);
        anything else is rejected before any agent call is made.
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, enum: [list-tros-nodes, list-tros-topics, disk-usage, service-status] }
      responses:
        "200":
          description: Command result from the agent.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "502": { description: Board agent unreachable or refused the command. }
  /api/v1/duck/board-station/devices:
    get:
      tags: [board-station]
      summary: Devices usable as the station target
      operationId: getBoardStationDevices
      responses:
        "200":
          description: Visible devices and agent configuration state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationDevicesResponse" }
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/duck/board-station/drive:
    get:
      tags: [board-station]
      summary: Constrained-drive state (motion canary)
      operationId: getBoardStationDrive
      description: >-
        Honest snapshot of the constrained-drive canary: platform switch,
        board agent switch, and the actuator policy (clamps, window, publish
        rate, chassis watchdog). Read-only; never moves the robot.
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        "200":
          description: Drive state and policy.
          content: { application/json: { schema: { $ref: "#/components/schemas/DriveState" } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "502": { description: Board agent unreachable (retryable). }
    post:
      tags: [board-station]
      summary: One clamped, time-boxed motion command
      operationId: postBoardStationDrive
      description: >-
        Sends a single constrained motion command to the board chassis.
        Double-gated: 409 unless BOTH the platform switch
        (RDK_SIM2REAL_STATION_DRIVE_ENABLED=1) and the board agent switch
        (RDK_SIM2REAL_BOARD_AGENT_ENABLE_DRIVE=1) are enabled. Values are
        re-clamped at the proxy and again on the board (linear <=0.3 m/s,
        angular <=1.0 rad/s, duration 0.2-2.0 s). The chassis firmware
        watchdog stops the robot 500 ms after /cmd_vel goes silent.
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriveCommand" }
      responses:
        "200":
          description: Command accepted; motion window opened.
          content: { application/json: { schema: { $ref: "#/components/schemas/DriveState" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "409":
          description: >-
            Refused: drive disabled on the platform (no agent call made), or
            the board agent refused (drive-disabled / out-of-range /
            rate-limited / publisher-unavailable). The refusal reason is
            passed through verbatim.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "502": { description: Board agent unreachable (retryable); robot stays at rest. }
  /api/v1/duck/board-station/drive/stop:
    post:
      tags: [board-station]
      summary: Emergency zero-speed stop (always available)
      operationId: postBoardStationDriveStop
      description: >-
        Zero-speed emergency stop. Always forwarded to the board agent
        regardless of both drive switches, so the stop path has no failure
        mode from gating. The board writes a zero command frame and the
        chassis watchdog enforces rest.
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        "200":
          description: Stop delivered; zero-speed frame published.
          content: { application/json: { schema: { $ref: "#/components/schemas/DriveState" } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "502": { description: Board agent unreachable; chassis watchdog still enforces rest. }
  /api/v1/duck/board-station/switches:
    get:
      tags: [board-station]
      summary: Platform-side motion switch states
      operationId: getBoardStationSwitches
      description: >-
        Honest platform gate states for the constrained-drive canary and the
        policy runtime. Values resolve as runtime override over the env
        default (RDK_SIM2REAL_STATION_DRIVE_ENABLED / _POLICY_ENABLED).
        Readable even when the board is unreachable.
      responses:
        "200":
          description: Platform switch states.
          content: { application/json: { schema: { $ref: "#/components/schemas/StationSwitchState" } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
    put:
      tags: [board-station]
      summary: Toggle the platform-side motion switches
      operationId: putBoardStationSwitches
      description: >-
        One half of the double gate: flips the platform drive/policy switches
        (persisted runtime override, env remains the deploy default). Turning
        a switch ON requires confirm=true in the same request (operator
        present, area cleared); turning OFF is always allowed. The board-side
        switches stay opt-in through the device-connection config surface.
        Emergency stop never consults these switches.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StationSwitchPatch" }
      responses:
        "200":
          description: Updated switch states.
          content: { application/json: { schema: { $ref: "#/components/schemas/StationSwitchState" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/duck/device-connections:
    get:
      tags: [devices]
      summary: List saved board connections and live tunnel flags
      operationId: listDeviceConnections
      description: >-
        Web-managed board connections (SSH coordinates). Each record reports
        whether its loopback SSH tunnel is currently up. Credentials are
        never stored: tunnels authenticate with the operator's local ssh
        keys/agent, exactly like scripts/deploy-x5-board-agent.sh.
      responses:
        "200":
          description: Saved connections.
          content: { application/json: { schema: { $ref: "#/components/schemas/DeviceConnectionList" } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
    post:
      tags: [devices]
      summary: Save SSH coordinates for one board
      operationId: createDeviceConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceConnectionInput" }
      responses:
        "201":
          description: Connection saved (tunnel not opened yet).
          content: { application/json: { schema: { $ref: "#/components/schemas/DeviceConnection" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "409": { description: Same host/port/user connection already exists. }
        "507": { description: Connection quota (50) exceeded. }
  /api/v1/duck/device-connections/{connectionId}:
    delete:
      tags: [devices]
      summary: Remove a saved connection and tear down its tunnel
      operationId: deleteDeviceConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200": { description: Connection deleted. }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/duck/device-connections/{connectionId}/connect:
    post:
      tags: [devices]
      summary: Open the SSH tunnel and probe the board agent
      operationId: connectDeviceConnection
      description: >-
        Spawns the server-side `ssh -N -L` loopback tunnel for this
        connection and verifies the board agent's /healthz through it. Fails
        closed: any SSH or health failure tears the tunnel down and reports
        the reason verbatim (no synthesized success).
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Tunnel up and agent healthy.
          content: { application/json: { schema: { $ref: "#/components/schemas/DeviceConnectionProbe" } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: SSH or agent health failure (reason passed through). }
        "503": { description: ssh client unavailable on the server. }
  /api/v1/duck/device-connections/{connectionId}/disconnect:
    post:
      tags: [devices]
      summary: Tear down this connection's tunnel
      operationId: disconnectDeviceConnection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200": { description: Tunnel torn down. }
        "401": { $ref: "#/components/responses/AuthRequired" }
  /api/v1/duck/device-connections/{connectionId}/config:
    get:
      tags: [devices]
      summary: Board-side motion switch states (through the tunnel)
      operationId: getDeviceConnectionConfig
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Board switch states, env file path, restartability.
          content: { application/json: { schema: { $ref: "#/components/schemas/BoardConfigState" } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "409": { description: Tunnel is down; connect the device first. }
        "502": { description: Board agent unreachable or predates /v1/config. }
    post:
      tags: [devices]
      summary: Flip the board-side motion switches (agent restarts)
      operationId: putDeviceConnectionConfig
      description: >-
        Accepts ONLY the two documented opt-in switches
        (RDK_SIM2REAL_BOARD_AGENT_ENABLE_DRIVE / _ENABLE_POLICY). The board
        agent rewrites its EnvironmentFile and restarts its own systemd unit
        so it cold-starts through the normal publisher handshake and
        watchdog; the restart is refused while a motion window is active.
        This surface can never send a speed command.
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoardConfigPatch" }
      responses:
        "200": { description: Switches applied; agent restarted (or env updated without restart on non-systemd boards). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "409": { description: Tunnel down, motion window active, or the board refused the restart. }
        "502": { description: Board agent unreachable; env untouched. }
  /api/v1/duck/compute-resources:
    get:
      tags: [workspace]
      summary: List account-owned GPU workers
      operationId: listComputeResources
      responses:
        "200": { description: Compute resources returned. }
    post:
      tags: [workspace]
      summary: Register a GPU worker
      operationId: createComputeResource
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [name, runnerUrl] } }
      responses:
        "201": { description: Compute resource created. }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/duck/compute-resources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [workspace]
      summary: Update a GPU worker
      operationId: updateComputeResource
      requestBody:
        content:
          application/json: { schema: { type: object } }
      responses:
        "200": { description: Compute resource updated. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workspace]
      summary: Remove a GPU worker
      operationId: deleteComputeResource
      responses:
        "200": { description: Compute resource removed. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/duck/compute-resources/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [workspace]
      summary: Probe a GPU worker health endpoint
      operationId: testComputeResource
      responses:
        "200": { description: Probe result returned. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/duck/datasets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [workspace]
      summary: Read one immutable dataset snapshot
      operationId: getDataset
      responses:
        "200": { description: Dataset, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [workspace]
      summary: Advance a dataset lifecycle state
      operationId: updateDatasetStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [registered, ready, revoked] }
      responses:
        "200": { description: Dataset state updated, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Invalid or terminal lifecycle transition. }
  /api/v1/duck/datasets/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [workspace]
      summary: Revoke an immutable dataset snapshot
      operationId: revokeDataset
      responses:
        "200": { description: Dataset revoked, content: { application/json: { schema: { $ref: "#/components/schemas/DatasetResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Dataset lifecycle transition is invalid. }
  /api/v1/duck/artifacts:
    get:
      tags: [workspace]
      summary: List immutable model artifacts and legacy catalog entries
      operationId: listArtifacts
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [model, checkpoint, recording, dataset, deployment, artifact] }
        - in: query
          name: modelId
          schema: { type: string }
        - in: query
          name: runId
          schema: { type: string }
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: taskId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200": { description: Artifact catalog, content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactsResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
    post:
      tags: [workspace]
      summary: Register one immutable artifact version
      operationId: createArtifact
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ArtifactInput" } }
      responses:
        "201": { description: Artifact registered, content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactRecordResponse" } } } }
        "200": { description: Idempotent replay, content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactRecordResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "409": { description: Artifact version or idempotency conflict. }
        "422": { description: Artifact lineage is invalid. }
  /api/v1/duck/artifacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [workspace]
      summary: Read one immutable artifact version
      operationId: getArtifact
      responses:
        "200": { description: Artifact, content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactRecordResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [workspace]
      summary: Advance an artifact lifecycle state
      operationId: updateArtifactStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [validated, published, revoked] }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: Artifact state updated, content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactRecordResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Artifact lifecycle transition is invalid. }
  /api/v1/duck/artifacts/{id}/validate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [workspace]
      summary: Validate an artifact version before publication
      operationId: validateArtifact
      responses:
        "200": { description: Artifact validated, content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactRecordResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Artifact lifecycle transition is invalid. }
  /api/v1/duck/artifacts/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [workspace]
      summary: Publish an immutable artifact version
      operationId: publishArtifact
      responses:
        "200": { description: Artifact published, content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactRecordResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Artifact must be validated before publication. }
  /api/v1/duck/artifacts/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [workspace]
      summary: Revoke an artifact version while retaining evidence
      operationId: revokeArtifact
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string, maxLength: 500 } }
      responses:
        "200": { description: Artifact revoked, content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactRecordResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Artifact lifecycle transition is invalid. }
  /api/v1/duck/evaluations:
    get:
      tags: [runs]
      summary: List first-class evaluation evidence
      operationId: listEvaluations
      parameters:
        - in: query
          name: runId
          schema: { type: string }
        - in: query
          name: artifactId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [pending, running, passed, failed, invalid] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200": { description: Evaluation evidence, content: { application/json: { schema: { $ref: "#/components/schemas/EvaluationsResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
    post:
      tags: [runs]
      summary: Register evaluation evidence for a run
      operationId: createEvaluation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/EvaluationInput" } }
      responses:
        "201": { description: Evaluation created, content: { application/json: { schema: { $ref: "#/components/schemas/EvaluationRecordResponse" } } } }
        "200": { description: Idempotent replay, content: { application/json: { schema: { $ref: "#/components/schemas/EvaluationRecordResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "422": { description: Evaluation lineage is invalid. }
  /api/v1/duck/evaluations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [runs]
      summary: Read one evaluation evidence record
      operationId: getEvaluation
      responses:
        "200": { description: Evaluation, content: { application/json: { schema: { $ref: "#/components/schemas/EvaluationRecordResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [runs]
      summary: Advance evaluation status or append result evidence
      operationId: updateEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, running, passed, failed, invalid] }
                summary: { type: string, maxLength: 500 }
                report: { type: object, additionalProperties: true }
                taskEvaluation: { $ref: "#/components/schemas/TaskEvaluation" }
                deviceId: { type: string }
      responses:
        "200": { description: Evaluation updated, content: { application/json: { schema: { $ref: "#/components/schemas/EvaluationRecordResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Evaluation lifecycle transition is invalid. }
  /api/v1/duck/lineage:
    get:
      tags: [workspace]
      summary: Read the owner-scoped dataset to deployment lineage graph
      operationId: getLineage
      parameters:
        - in: query
          name: runId
          schema: { type: string }
        - in: query
          name: artifactId
          schema: { type: string }
        - in: query
          name: evaluationId
          schema: { type: string }
        - in: query
          name: projectId
          schema: { type: string }
          description: Exactly one selector is required.
      responses:
        "200": { description: Lineage graph, content: { application/json: { schema: { $ref: "#/components/schemas/LineageResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/duck/runs/{runId}/lineage:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      summary: Read lineage anchored at one run
      operationId: getRunLineage
      responses:
        "200": { description: Lineage graph, content: { application/json: { schema: { $ref: "#/components/schemas/LineageResponse" } } } }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: rdk_sso_web_session
      description: >-
        Site-wide encrypted session cookie issued by the Studio main shell;
        the reference studio-cookie-auth adapter verifies it with
        AES-256-GCM (v1.iv.tag.ciphertext). The reference local adapter has
        no login.
    telemetryBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived server-issued HS256 board-agent attestation. Claims bind
        owner, runId and deviceId and include an exp Unix timestamp. Bearer
        uploads must include a non-negative chunk sequence; retries with the
        same (run, device, sequence, content) are idempotent while a conflicting
        sequence is rejected. The telemetry service sets attested=true only
        after successful verification; this credential cannot be used for other
        API resources. Legacy uploads without this credential remain review-only.
  parameters:
    ProductId:
      in: query
      name: productId
      schema: { type: string, enum: [microduck, rdk-duck] }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: Required for local/RoboGo runs and canary/live plans.
    ModelId:
      in: path
      name: modelId
      required: true
      schema: { type: string }
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema: { type: string }
    ConnectionId:
      in: path
      name: connectionId
      required: true
      schema: { type: string }
      description: Board connection id from POST /device-connections.
    RunId:
      in: path
      name: runId
      required: true
      schema: { type: string }
    DeploymentId:
      in: path
      name: deploymentId
      required: true
      schema: { type: string }
    ProjectId:
      in: path
      # The runtime keeps the legacy `:id` mount parameter for this resource;
      # keep the versioned OpenAPI template aligned with the actual route.
      name: id
      required: true
      schema: { type: string }
  responses:
    Ready:
      description: Control plane is ready.
      content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }
    NotReady:
      description: A required dependency is not ready.
      content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }
    AuthRequired:
      description: Shared deployment requires a verified SSO principal.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Input or contract validation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource is not visible to this account.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Project:
      type: object
      required: [id, name, slug, modelIds, datasetIds, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,63}$' }
        description: { type: string }
        modelIds: { type: array, items: { type: string } }
        datasetIds: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        slug: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 4000 }
        modelIds: { type: array, maxItems: 100, items: { type: string } }
        datasetIds: { type: array, maxItems: 500, items: { type: string } }
    Dataset:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string, maxLength: 64 }
        description: { type: string }
        uri: { type: string }
        format: { type: string }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        contractId: { type: string }
        sourceRunId: { type: string }
        sampleCount: { type: integer, minimum: 0 }
        sizeBytes: { type: integer, minimum: 0 }
        tags: { type: array, items: { type: string } }
        status: { type: string, enum: [registered, ready, revoked] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DatasetInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        version: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 4000 }
        uri: { type: string, maxLength: 2048 }
        format: { type: string, maxLength: 32 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        contractId: { type: string, maxLength: 128 }
        sourceRunId: { type: string, maxLength: 128 }
        sampleCount: { type: integer, minimum: 0 }
        sizeBytes: { type: integer, minimum: 0 }
        tags: { type: array, maxItems: 32, items: { type: string } }
        status: { type: string, enum: [registered, ready] }
    ProjectsResponse:
      type: object
      required: [ok, projects]
      properties:
        ok: { const: true }
        projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
    ProjectResponse:
      type: object
      required: [ok, project]
      properties:
        ok: { const: true }
        project: { $ref: "#/components/schemas/Project" }
    ProjectDetailResponse:
      allOf:
        - $ref: "#/components/schemas/ProjectResponse"
        - type: object
          properties:
            datasets: { type: array, items: { $ref: "#/components/schemas/Dataset" } }
            runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
    RunComparisonResponse:
      type: object
      required: [ok, projectId, runs, comparison]
      properties:
        ok: { const: true }
        projectId: { type: string }
        runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
        comparison: { type: array, items: { type: object, additionalProperties: true } }
    DatasetsResponse:
      type: object
      required: [ok, datasets]
      properties:
        ok: { const: true }
        datasets: { type: array, items: { $ref: "#/components/schemas/Dataset" } }
    DatasetResponse:
      type: object
      required: [ok, dataset]
      properties:
        ok: { const: true }
        dataset: { $ref: "#/components/schemas/Dataset" }
    ArtifactRecord:
      type: object
      required: [id, artifactId, version, name, role, kind, format, ref, sha256, datasetIds, evaluationIds, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        artifactId: { type: string, maxLength: 128 }
        version: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
        name: { type: string, maxLength: 180 }
        role: { type: string, enum: [policy, compiled-policy, calibration] }
        kind: { type: string, enum: [source, compiled] }
        format: { type: string, enum: [pytorch, onnx, bin, hbm, gguf, unknown] }
        runtime: { type: string, enum: [cpu-onnx, bpu] }
        workload: { type: string, enum: [locomotion, perception, navigation, speech, multimodal] }
        threads: { type: integer, minimum: 1, maximum: 128 }
        targetPlatforms: { type: array, items: { type: string } }
        toolchainTarget: { type: string }
        acceleratorArchitecture: { type: string }
        runtimePackage: { type: string }
        ref: { type: string, pattern: '^artifact://' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sizeBytes: { type: integer, minimum: 0 }
        modelId: { type: string }
        runId: { type: string }
        datasetIds: { type: array, items: { type: string } }
        evaluationIds: { type: array, items: { type: string } }
        contractId: { type: string }
        status: { type: string, enum: [draft, validated, published, revoked] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        revocationReason: { type: string }
    ArtifactInput:
      type: object
      required: [artifactId, version, name, role, kind, format, ref, sha256]
      properties:
        artifactId: { type: string, maxLength: 128 }
        version: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 180 }
        role: { type: string, enum: [policy, compiled-policy, calibration] }
        kind: { type: string, enum: [source, compiled] }
        format: { type: string, enum: [pytorch, onnx, bin, hbm, gguf, unknown] }
        runtime: { type: string, enum: [cpu-onnx, bpu] }
        workload: { type: string, enum: [locomotion, perception, navigation, speech, multimodal] }
        threads: { type: integer, minimum: 1, maximum: 128 }
        targetPlatforms: { type: array, maxItems: 16, items: { type: string } }
        toolchainTarget: { type: string, maxLength: 128 }
        acceleratorArchitecture: { type: string, maxLength: 64 }
        runtimePackage: { type: string, maxLength: 128 }
        ref: { type: string, pattern: '^artifact://' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sizeBytes: { type: integer, minimum: 0 }
        modelId: { type: string }
        runId: { type: string }
        datasetIds: { type: array, maxItems: 500, items: { type: string } }
        evaluationIds: { type: array, maxItems: 500, items: { type: string } }
        contractId: { type: string }
        status: { type: string, enum: [draft, validated, published] }
        metadata: { type: object, additionalProperties: true }
        idempotencyKey: { type: string, maxLength: 128 }
    ArtifactCatalogEntry:
      type: object
      required: [id, type, name, status, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [model, checkpoint, recording, dataset, deployment, artifact] }
        name: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        modelId: { type: string }
        runId: { type: string }
        projectId: { type: string }
        taskId: { type: string }
        datasetIds: { type: array, items: { type: string } }
        artifactIds: { type: array, items: { type: string } }
        format: { type: string }
        uri: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        sampleCount: { type: integer, minimum: 0 }
        metadata: { type: object, additionalProperties: true }
    ArtifactsResponse:
      type: object
      required: [ok, artifacts, total, available]
      properties:
        ok: { const: true }
        artifacts: { type: array, items: { $ref: "#/components/schemas/ArtifactCatalogEntry" } }
        total: { type: integer, minimum: 0 }
        available: { type: integer, minimum: 0 }
    ArtifactRecordResponse:
      type: object
      required: [ok, artifact]
      properties:
        ok: { const: true }
        artifact: { $ref: "#/components/schemas/ArtifactRecord" }
        idempotentReplay: { type: boolean }
    EvaluationRecord:
      type: object
      required: [id, runId, modelId, datasetIds, status, summary, source, createdAt, updatedAt]
      properties:
        id: { type: string }
        runId: { type: string }
        modelId: { type: string }
        artifactId: { type: string }
        datasetIds: { type: array, items: { type: string } }
        projectId: { type: string }
        taskId: { type: string }
        status: { type: string, enum: [pending, running, passed, failed, invalid] }
        summary: { type: string }
        report: { type: object, additionalProperties: true }
        taskEvaluation: { $ref: "#/components/schemas/TaskEvaluation" }
        source: { type: string, enum: [platform, runner, import] }
        deviceId: { type: string }
        contractId: { type: string }
        seed: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    EvaluationInput:
      type: object
      required: [runId]
      properties:
        runId: { type: string }
        artifactId: { type: string }
        datasetIds: { type: array, maxItems: 500, items: { type: string } }
        projectId: { type: string }
        taskId: { type: string }
        status: { type: string, enum: [pending, running, passed, failed, invalid], default: pending }
        summary: { type: string, maxLength: 500 }
        report: { type: object, additionalProperties: true }
        taskEvaluation: { $ref: "#/components/schemas/TaskEvaluation" }
        source: { type: string, enum: [platform, runner, import], default: import }
        deviceId: { type: string }
        contractId: { type: string }
        seed: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, maxLength: 128 }
    EvaluationsResponse:
      type: object
      required: [ok, evaluations, total, available]
      properties:
        ok: { const: true }
        evaluations: { type: array, items: { $ref: "#/components/schemas/EvaluationRecord" } }
        total: { type: integer, minimum: 0 }
        available: { type: integer, minimum: 0 }
    EvaluationRecordResponse:
      type: object
      required: [ok, evaluation]
      properties:
        ok: { const: true }
        evaluation: { $ref: "#/components/schemas/EvaluationRecord" }
        idempotentReplay: { type: boolean }
    LineageResponse:
      type: object
      required: [ok, lineage]
      properties:
        ok: { const: true }
        lineage:
          type: object
          required: [project, datasets, run, runs, artifacts, evaluations, deployments]
          properties:
            project:
              oneOf:
                - $ref: "#/components/schemas/Project"
                - type: "null"
            datasets: { type: array, items: { $ref: "#/components/schemas/Dataset" } }
            run:
              oneOf:
                - $ref: "#/components/schemas/Run"
                - type: "null"
            runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
            artifacts: { type: array, items: { $ref: "#/components/schemas/ArtifactRecord" } }
            evaluations: { type: array, items: { $ref: "#/components/schemas/EvaluationRecord" } }
            deployments: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
    AuditEvent:
      type: object
      required: [id, at, action, resourceType, outcome, status]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        owner: { type: string }
        actor: { type: object, additionalProperties: true }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        outcome: { type: string, enum: [succeeded, failed, denied] }
        status: { type: integer, minimum: 100, maximum: 599 }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
    AuditResponse:
      type: object
      required: [ok, events, total]
      properties:
        ok: { const: true }
        events: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        total: { type: integer, minimum: 0 }
    AuditHealthResponse:
      type: object
      required: [ok, configured, readable, writable]
      properties:
        ok: { type: boolean }
        configured: { type: boolean }
        readable: { type: boolean }
        writable: { type: boolean }
        eventCount: { type: integer, minimum: 0, nullable: true }
    SsoLoginRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [account, sms, email]
          description: Only whitelisted fields are relayed upstream; everything else is dropped.
        userName: { type: string, maxLength: 4096 }
        password: { type: string, maxLength: 4096, description: Relayed to the Studio account center, never stored. }
        mobile: { type: string, maxLength: 4096 }
        email: { type: string, maxLength: 4096 }
        code: { type: string, maxLength: 4096 }
        emailcode: { type: string, maxLength: 4096 }
    SsoSessionResponse:
      type: object
      required: [ok, identity]
      properties:
        ok: { const: true }
        identity:
          type: object
          required: [accountId]
          properties:
            accountId: { type: string }
            displayName: { type: string }
            email: { type: string }
        sessionExpiresAt: { type: string }
        loginRelay:
          type: object
          properties:
            configured: { type: boolean }
            loginPageUrl: { type: string }
    StationHealthResponse:
      type: object
      required: [ok, device, agent, cameraSupported]
      properties:
        ok: { const: true }
        device:
          type: object
          required: [id, name, status]
          properties:
            id: { type: string }
            name: { type: string }
            status: { type: string }
            boardPlatform: { type: [string, "null"] }
            boardModel: { type: [string, "null"] }
        agent:
          type: object
          required: [capabilities, stationCommands, actuatorControl, mock]
          properties:
            capabilities: { type: array, items: { type: string } }
            stationCommands: { type: array, items: { type: object, additionalProperties: true } }
            actuatorControl: { type: boolean }
            mock: { type: boolean }
        cameraSupported: { type: boolean }
    StationDevicesResponse:
      type: object
      required: [ok, agentConfigured, devices]
      properties:
        ok: { const: true }
        agentConfigured: { type: boolean }
        devices:
          type: array
          items:
            type: object
            required: [id, name, status]
            properties:
              id: { type: string }
              name: { type: string }
              status: { type: string }
              boardPlatform: { type: [string, "null"] }
              boardModel: { type: [string, "null"] }
              connectionMode: { type: [string, "null"] }
    BoardPolicyResponse:
      type: object
      required: [ok, platformEnabled, drivePlatformEnabled, policy]
      properties:
        ok: { const: true }
        platformEnabled: { type: boolean }
        drivePlatformEnabled: { type: boolean }
        policy:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
    DriveCommand:
      type: object
      required: [linear, angular, durationSec]
      properties:
        linear:
          type: number
          minimum: -0.3
          maximum: 0.3
          description: Forward/backward speed in m/s; re-clamped at both proxy and board.
        angular:
          type: number
          minimum: -1.0
          maximum: 1.0
          description: Yaw rate in rad/s; re-clamped at both proxy and board.
        durationSec:
          type: number
          minimum: 0.2
          maximum: 2.0
          description: Motion window length in seconds; one command may never drive longer.
    StationSwitchState:
      type: object
      required: [ok, drive, policy]
      properties:
        ok: { type: boolean }
        drive:
          type: boolean
          description: Platform constrained-drive switch (runtime override over RDK_SIM2REAL_STATION_DRIVE_ENABLED).
        policy:
          type: boolean
          description: Platform policy-runtime switch (runtime override over RDK_SIM2REAL_STATION_POLICY_ENABLED).
    StationSwitchPatch:
      type: object
      properties:
        drive: { type: boolean, description: New platform drive switch value. }
        policy: { type: boolean, description: New platform policy switch value. }
        confirm:
          type: boolean
          description: Required true when turning a switch ON (operator present, area cleared).
        reset:
          type: boolean
          description: True to drop the runtime override and fall back to the env default.
    DeviceConnection:
      type: object
      required: [id, label, host, port, username, agentPort, tunnelActive]
      properties:
        id: { type: string }
        label: { type: string }
        host: { type: string, description: SSH host/IP without scheme. }
        port: { type: integer, description: SSH port (default 22). }
        username: { type: string }
        agentPort: { type: integer, description: Board agent port on the board (default 19100). }
        tunnelActive: { type: boolean, description: True while this connection's loopback tunnel is up. }
        createdAt: { type: string, format: date-time }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        lastCheckOk: { type: boolean, nullable: true }
        lastCheckMessage: { type: string }
    DeviceConnectionList:
      type: object
      required: [ok, connections]
      properties:
        ok: { type: boolean }
        connections:
          type: array
          items: { $ref: "#/components/schemas/DeviceConnection" }
        sshNote: { type: string }
    DeviceConnectionInput:
      type: object
      required: [host]
      properties:
        host: { type: string, description: Board IP or hostname, no scheme. }
        port: { type: integer, default: 22 }
        username: { type: string, default: root }
        label: { type: string }
        agentPort: { type: integer, default: 19100 }
    DeviceConnectionProbe:
      type: object
      required: [ok, connection, probe]
      properties:
        ok: { type: boolean }
        connection: { $ref: "#/components/schemas/DeviceConnection" }
        probe:
          type: object
          required: [ok, message]
          properties:
            ok: { type: boolean }
            message: { type: string }
            agentInfo:
              type: object
              properties:
                mock: { type: boolean }
                capabilities: { type: array, items: { type: string } }
                boardModel: { type: string }
    BoardConfigState:
      type: object
      required: [ok, switches, restartable]
      properties:
        ok: { type: boolean }
        envFile: { type: string }
        envFileExists: { type: boolean }
        unit: { type: string }
        systemdManaged: { type: boolean }
        restartable: { type: boolean }
        switches:
          type: object
          required: [RDK_SIM2REAL_BOARD_AGENT_ENABLE_DRIVE, RDK_SIM2REAL_BOARD_AGENT_ENABLE_POLICY]
          properties:
            RDK_SIM2REAL_BOARD_AGENT_ENABLE_DRIVE: { type: boolean }
            RDK_SIM2REAL_BOARD_AGENT_ENABLE_POLICY: { type: boolean }
    BoardConfigPatch:
      type: object
      required: [switches]
      properties:
        switches:
          type: object
          minProperties: 1
          maxProperties: 2
          propertyNames:
            enum: [RDK_SIM2REAL_BOARD_AGENT_ENABLE_DRIVE, RDK_SIM2REAL_BOARD_AGENT_ENABLE_POLICY]
          additionalProperties: { type: boolean }
    DriveState:
      type: object
      required: [ok, platformEnabled, drive]
      properties:
        ok: { type: boolean }
        platformEnabled:
          type: boolean
          description: The platform-side drive switch state (RDK_SIM2REAL_STATION_DRIVE_ENABLED).
        drive:
          type: object
          required: [enabled, active]
          properties:
            enabled: { type: boolean, description: Board agent drive switch state. }
            active: { type: boolean, description: True while a motion window is open. }
            linear: { type: number }
            angular: { type: number }
            remainingMs: { type: integer }
            lastStopReason: { type: string }
            published: { type: integer, description: Total accepted commands since agent start. }
        actuatorPolicy:
          type: object
          properties:
            enabled: { type: boolean }
            maxLinear: { type: number }
            maxAngular: { type: number }
            maxWindowSec: { type: number }
            publishHz: { type: integer }
            chassisWatchdogMs: { type: integer }
            emergencyStop: { type: string }
    Error:
      type: object
      required: [ok, error]
      properties:
        ok: { const: false }
        error: { type: string }
        code: { type: string }
        message: { type: string, description: Human-readable detail when available. }
        requestId: { type: string }
        retryable: { type: boolean }
    Health:
      type: object
      required: [ok, service, ready, schemaVersion]
      properties:
        ok: { type: boolean }
        service: { const: sim2real-web }
        ready: { type: boolean }
        schemaVersion: { type: integer, const: 1 }
        degraded: { type: array, items: { type: string } }
    BoardDetectResponse:
      type: object
      required: [ok, platform, model, osVersion, checks, device, output, persisted, mock, actuatorControl]
      properties:
        ok: { const: true }
        platform: { type: [string, "null"] }
        model: { type: string }
        osVersion: { type: string }
        checks: { type: object, additionalProperties: true }
        device: { type: object, additionalProperties: true }
        output: { type: string, maxLength: 12000 }
        persisted: { type: boolean }
        mock: { type: boolean }
        actuatorControl: { type: boolean }
    Contract:
      type: object
      required: [id, robotId, jointCount, observationSize, actionSize, controlHz, physicsTimestepSeconds, decimation, observationLayout]
      properties:
        id: { type: string }
        robotId: { type: string, enum: [microduck, rdk-duck, originbot] }
        jointCount: { type: integer, minimum: 1, maximum: 256 }
        observationSize: { type: integer, minimum: 1, maximum: 4096 }
        actionSize: { type: integer, minimum: 1, maximum: 4096 }
        controlHz: { type: number, exclusiveMinimum: 0, maximum: 1000 }
        physicsTimestepSeconds: { type: number, exclusiveMinimum: 0, maximum: 1 }
        decimation: { type: integer, minimum: 1, maximum: 256 }
        observationLayout:
          type: array
          maxItems: 16
          items:
            type: object
            required: [name, size]
            properties:
              name: { type: string }
              size: { type: integer, minimum: 1, maximum: 4096 }
    Artifact:
      type: object
      required: [id, role, name, kind, format, ref]
      properties:
        id: { type: string }
        role: { type: string, enum: [policy, compiled-policy, calibration] }
        name: { type: string }
        kind: { type: string, enum: [source, compiled] }
        format: { type: string, enum: [pytorch, onnx, bin, hbm, gguf, unknown] }
        runtime: { type: string, enum: [cpu-onnx, bpu] }
        workload: { type: string, enum: [locomotion, perception, navigation, speech, multimodal] }
        threads: { type: integer, minimum: 1, maximum: 128 }
        targetPlatforms: { type: array, items: { type: string } }
        ref: { type: string, pattern: "^artifact://" }
    Manifest:
      type: object
      required: [schemaVersion, modelId, displayName, version, robot, contract, simulator, artifacts]
      properties:
        schemaVersion: { type: integer, const: 1 }
        modelId: { type: string }
        displayName: { type: string }
        version: { type: string }
        robot: { type: object, required: [id, variant], properties: { id: { type: string, enum: [microduck, rdk-duck, originbot] }, variant: { type: string } } }
        contract: { $ref: "#/components/schemas/Contract" }
        simulator: { type: object, required: [backends, policyArtifactId], additionalProperties: true }
        artifacts: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Artifact" } }
    ManifestEnvelope:
      oneOf:
        - $ref: "#/components/schemas/Manifest"
        - type: object
          required: [manifest]
          properties:
            manifest: { $ref: "#/components/schemas/Manifest" }
            platforms: { type: array, items: { type: string } }
    Training:
      type: object
      description: All fields are optional; the selected profile supplies safe defaults.
      properties:
        profile: { type: string, enum: [smoke, low-vram, standard, high-vram] }
        numEnvs: { type: integer, minimum: 1, maximum: 16384 }
        maxIterations: { type: integer, minimum: 1, maximum: 2000000 }
        video: { type: boolean }
        runName: { type: string, maxLength: 80 }
    RunRequest:
      type: object
      required: [modelId, backend]
      properties:
        modelId: { type: string }
        backend: { type: string, enum: [browser, local, robogo, contract] }
        taskId: { type: string }
        projectId: { type: string }
        experimentId: { type: string }
        label: { type: string, maxLength: 120 }
        computeResourceId: { type: string }
        datasetIds: { type: array, maxItems: 500, items: { type: string } }
        training: { $ref: "#/components/schemas/Training" }
        resumeFrom: { type: object, required: [checkpointId, artifactRef], properties: { checkpointId: { type: string }, artifactRef: { type: string }, iteration: { type: integer, minimum: 0 } } }
        idempotencyKey: { type: string, maxLength: 128 }
    TaskEvaluationEnvelope:
      type: object
      properties:
        successRate: { type: number, minimum: 0, maximum: 1 }
        collisionRate: { type: number, minimum: 0, maximum: 1 }
        successRateCiLow: { type: number, minimum: 0, maximum: 1 }
        successRateCiHigh: { type: number, minimum: 0, maximum: 1 }
        collisionRateCiLow: { type: number, minimum: 0, maximum: 1 }
        collisionRateCiHigh: { type: number, minimum: 0, maximum: 1 }
        episodes: { type: integer, minimum: 1, maximum: 100000 }
        meanReward: { type: number }
    TaskEvaluation:
      type: object
      required: [taskId]
      description: Sanitized Task-Pack eval-report evidence. The server recomputes release eligibility from these measurements and never trusts the runner's boolean alone.
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        taskId: { type: string }
        adapterId: { type: string }
        observationAdapterId: { type: string }
        trained:
          type: object
          properties:
            envelopes: { type: object, additionalProperties: { $ref: "#/components/schemas/TaskEvaluationEnvelope" } }
            meanReward: { type: number }
            episodesPerEnvelope: { type: integer, minimum: 1 }
            confidenceLevel: { type: number, minimum: 0.5, maximum: 0.9999 }
        baseline:
          type: object
          properties:
            envelopes: { type: object, additionalProperties: { $ref: "#/components/schemas/TaskEvaluationEnvelope" } }
            meanReward: { type: number }
            episodesPerEnvelope: { type: integer, minimum: 1 }
            confidenceLevel: { type: number, minimum: 0.5, maximum: 0.9999 }
        qualityGate:
          type: object
          properties:
            passed: { type: boolean, description: Informational only; the server recomputes the verdict. }
            errors: { type: array, maxItems: 32, items: { type: string, maxLength: 240 } }
            criteria:
              type: object
              properties:
                minSuccessRate: { type: number, minimum: 0, maximum: 1 }
                maxCollisionRate: { type: number, minimum: 0, maximum: 1 }
                gateOn: { type: string, enum: [point, ciLowerBound] }
        controlLatencyMs: { type: number, minimum: 0, maximum: 60000 }
        seed: { type: integer, minimum: 0 }
        reportSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    Run:
      type: object
      required: [id, modelId, backend, status, summary, createdAt]
      properties:
        id: { type: string }
        modelId: { type: string }
        productId: { type: string, enum: [microduck, rdk-duck] }
        contractId: { type: string }
        taskId: { type: string }
        projectId: { type: string }
        datasetIds: { type: array, items: { type: string } }
        artifactIds: { type: array, items: { type: string } }
        evaluationId: { type: string }
        backend: { type: string, enum: [browser, local, robogo, contract] }
        status: { type: string, enum: [ready, queued, running, completed, blocked, failed] }
        summary: { type: string }
        externalRunId: { type: string }
        mock: { type: boolean }
        training: { $ref: "#/components/schemas/Training" }
        checkpoint: { type: object, additionalProperties: true }
        artifact: { type: object, additionalProperties: true }
        metrics: { type: object, additionalProperties: true }
        taskEvaluation: { $ref: "#/components/schemas/TaskEvaluation" }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    Model:
      type: object
      required: [id, manifest, createdAt, updatedAt]
      properties:
        id: { type: string }
        productId: { type: string }
        contractId: { type: string }
        builtin: { type: boolean }
        manifest: { $ref: "#/components/schemas/Manifest" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Compatibility:
      type: object
      required: [platformId, status, deployable, reason]
      properties:
        platformId: { type: string }
        status: { type: string }
        artifactId: { type: string }
        deployable: { type: boolean }
        reason: { type: string }
        result: { type: object, additionalProperties: true }
    DeploymentRequest:
      type: object
      description: runId and Idempotency-Key are mandatory when mode is canary or live; preflight remains read-only and does not require training evidence.
      required: [modelId, deviceId]
      properties:
        modelId: { type: string }
        deviceId: { type: string }
        mode: { type: string, enum: [preflight, canary, live], default: preflight }
        runId: { type: string, description: Completed non-mock local/RoboGo run whose artifact and metrics authorize canary/live planning. }
        artifactId: { type: string, description: Immutable published artifact authorized by the release gate. }
        evaluationId: { type: string, description: Passed evaluation evidence associated with the run. }
        idempotencyKey: { type: string, maxLength: 128 }
    Deployment:
      type: object
      required: [id, modelId, deviceId, targetPlatform, mode, status, summary, steps, createdAt, updatedAt]
      properties:
        id: { type: string }
        modelId: { type: string }
        runId: { type: string }
        artifactId: { type: string }
        evaluationId: { type: string }
        deviceId: { type: string }
        targetPlatform: { type: string }
        mode: { type: string }
        status: { type: string, enum: [planned, running, ready, blocked, failed, completed, cancelled] }
        summary: { type: string }
        compatibility: { $ref: "#/components/schemas/Compatibility" }
        steps: { type: array, items: { type: object, additionalProperties: true } }
        history:
          type: array
          items:
            type: object
            required: [id, type, status, summary, createdAt]
            properties:
              id: { type: string }
              type: { type: string, enum: [created, status_changed, preflight, cancelled, version_switched, approval_approved, approval_rejected, updated] }
              status: { type: string }
              summary: { type: string }
              createdAt: { type: string, format: date-time }
        approval:
          type: object
          required: [status, requestedAt]
          properties:
            status: { type: string, enum: [pending, approved, rejected] }
            requestedAt: { type: string, format: date-time }
            requestedBy: { type: string }
            decidedAt: { type: string, format: date-time }
            decidedBy: { type: string }
            note: { type: string, maxLength: 500 }
        verification:
          type: object
          required: [passed, checkedAt]
          properties:
            passed: { type: boolean }
            checkedAt: { type: string, format: date-time }
            checks: { type: object, additionalProperties: { type: [string, number, "null"] } }
            mock: { type: boolean }
        releaseGate:
          type: object
          required: [passed, checkedAt, errors, checks]
          properties:
            passed: { type: boolean }
            checkedAt: { type: string, format: date-time }
            runId: { type: string }
            taskId: { type: string }
            errors: { type: array, items: { type: string } }
            checks: { type: object, additionalProperties: { type: [boolean, string, number, "null"] } }
        versionSwitchFrom: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TelemetrySample:
      type: object
      required: [t]
      properties:
        t: { type: number, minimum: 0, maximum: 86400 }
        observation: { type: array, maxItems: 4096, items: { type: number } }
        action: { type: array, maxItems: 4096, items: { type: number } }
        reward: { type: number }
        done: { type: boolean }
        fall: { type: boolean }
        cmd_vel:
          type: object
          required: [linear, angular]
          properties:
            linear: { type: number, minimum: -0.3, maximum: 0.3 }
            angular: { type: number, minimum: -1, maximum: 1 }
        actionOutput: { type: string, enum: [physical-twist, normalized-twist] }
        actionScale:
          type: object
          required: [linear, angular]
          properties:
            linear: { type: number, exclusiveMinimum: 0, maximum: 0.3 }
            angular: { type: number, exclusiveMinimum: 0, maximum: 1 }
            units: { type: string, enum: ['m/s,rad/s'] }
        controlHz: { type: integer, minimum: 1, maximum: 50 }
        controlPeriodSeconds: { type: number, minimum: 0.02, maximum: 1 }
        event:
          description: >-
            Board policy-session lifecycle marker. A sample carrying `event`
            must not carry observation/action/control fields; markers are
            excluded from replay statistics and aggregated by
            /runs/{runId}/board-sessions instead.
          type: object
          required: [kind, sessionId]
          properties:
            kind: { type: string, enum: [session-started, session-stopped] }
            sessionId: { type: string, maxLength: 64 }
            startedAt: { type: string, format: date-time }
            stoppedAt: { type: string, format: date-time }
            stopReason: { type: string, maxLength: 120 }
            inferenceCount: { type: integer, minimum: 0 }
            lastInferenceAt: { type: string, format: date-time }
            durationSec: { type: number, minimum: 0, maximum: 86400 }
            inferMs: { type: number, minimum: 0, maximum: 10000 }
            published: { type: integer, minimum: 0 }
            mock: { type: boolean }
            adapterId: { type: string, maxLength: 80 }
            controlHz: { type: integer, minimum: 1, maximum: 50 }
            model:
              type: object
              properties:
                sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                provider: { type: string, maxLength: 64 }
                inputDim: { type: integer, minimum: 1 }
                outputDim: { type: integer, minimum: 1 }
                bytes: { type: integer, minimum: 0 }
    BoardSessionSummary:
      type: object
      required: [sessionId, attested, chunks, events]
      properties:
        sessionId: { type: string }
        startedAt: { type: string, format: date-time }
        stoppedAt: { type: string, format: date-time }
        stopReason: { type: string }
        lastInferenceAt: { type: string, format: date-time }
        inferenceCount: { type: integer, minimum: 0 }
        published: { type: integer, minimum: 0 }
        inferMs: { type: number, minimum: 0 }
        durationSec: { type: number, minimum: 0 }
        mock: { type: boolean }
        adapterId: { type: string }
        controlHz: { type: integer, minimum: 1, maximum: 50 }
        deviceId: { type: string }
        attested: { type: boolean }
        chunks: { type: integer, minimum: 1 }
        events: { type: integer, minimum: 1 }
        model:
          type: object
          properties:
            sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
            provider: { type: string }
            inputDim: { type: integer, minimum: 1 }
            outputDim: { type: integer, minimum: 1 }
            bytes: { type: integer, minimum: 0 }
    TelemetryRequestWithoutRunId:
      type: object
      properties:
        source: { type: string, enum: [board-agent, browser, import, demo-fixture], default: import, description: "demo-fixture 仅表示内置合成演示数据；不会满足真实评测或发布闸门" }
        modelId: { type: string }
        deviceId: { type: string }
        contractId: { type: string }
        sequence: { type: integer, minimum: 0 }
        droppedCount: { type: integer, minimum: 0 }
        samples: { type: array, minItems: 1, maxItems: 5000, items: { $ref: "#/components/schemas/TelemetrySample" } }
        jsonl: { type: string, maxLength: 2000000 }
        idempotencyKey: { type: string, maxLength: 128 }
    TelemetryRequest:
      allOf:
        - $ref: "#/components/schemas/TelemetryRequestWithoutRunId"
        - type: object
          required: [runId]
          properties: { runId: { type: string } }
    WorkspaceSummaryResponse:
      type: object
      required: [ok, schemaVersion, generatedAt, counts, latest]
      properties:
        ok: { const: true }
        schemaVersion: { type: integer, const: 1 }
        generatedAt: { type: string, format: date-time }
        counts:
          type: object
          required: [models, runs, activeRuns, deployments, activeDeployments, devices, connectedDevices, detectedDevices, projects, datasets]
          properties:
            models: { type: integer, minimum: 0 }
            runs: { type: integer, minimum: 0 }
            activeRuns: { type: integer, minimum: 0 }
            deployments: { type: integer, minimum: 0 }
            activeDeployments: { type: integer, minimum: 0 }
            devices: { type: integer, minimum: 0 }
            connectedDevices: { type: integer, minimum: 0 }
            detectedDevices: { type: integer, minimum: 0 }
            projects: { type: integer, minimum: 0 }
            datasets: { type: integer, minimum: 0 }
        latest:
          type: object
          required: [run, deployment]
          properties:
            run:
              oneOf:
                - $ref: "#/components/schemas/WorkspaceRunSummary"
                - type: "null"
            deployment:
              oneOf:
                - $ref: "#/components/schemas/WorkspaceDeploymentSummary"
                - type: "null"
    WorkspaceRunSummary:
      type: object
      required: [id, modelId, backend, status, summary, createdAt]
      properties:
        id: { type: string }
        modelId: { type: string }
        taskId: { type: string }
        backend: { type: string, enum: [browser, local, robogo, contract] }
        status: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    WorkspaceDeploymentSummary:
      type: object
      required: [id, modelId, deviceId, targetPlatform, mode, status, summary, createdAt, updatedAt]
      properties:
        id: { type: string }
        modelId: { type: string }
        deviceId: { type: string }
        targetPlatform: { type: string }
        mode: { type: string, enum: [preflight, canary, live] }
        status: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OverviewResponse:
      type: object
      required: [ok, schemaVersion, productProfiles, selectedProductId, models, runs, deployments, devices, integrations]
      properties:
        ok: { const: true }
        schemaVersion: { type: integer, const: 1 }
        identity: { type: [object, "null"], additionalProperties: true }
        productProfiles: { type: array, items: { type: object, additionalProperties: true } }
        selectedProductId: { type: string, enum: [microduck, rdk-duck] }
        selectedContract:
          oneOf:
            - $ref: "#/components/schemas/Contract"
            - type: "null"
        availableContracts: { type: array, items: { type: object, additionalProperties: true } }
        contracts: { type: object, additionalProperties: true }
        contract: { $ref: "#/components/schemas/Contract" }
        models: { type: array, items: { $ref: "#/components/schemas/Model" } }
        runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
        deployments: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
        devices: { type: array, items: { $ref: "#/components/schemas/DeviceSummary" } }
        integrations: { $ref: "#/components/schemas/Integrations" }
        artifacts:
          type: array
          description: First-class immutable registry artifacts (newest 100) powering the promotion-flow view.
          items: { $ref: "#/components/schemas/ArtifactRecord" }
        evaluations:
          type: array
          description: First-class evaluation evidence records (newest 100) linked to runs and artifacts.
          items: { $ref: "#/components/schemas/EvaluationRecord" }
    DeviceSummary:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        boardPlatform: { type: [string, "null"] }
        boardModel: { type: [string, "null"] }
        connectionMode: { type: string }
        sshReachability: { type: string }
    LocalWorkerIntegration:
      type: object
      required: [available, reachable, healthy, message]
      properties:
        available: { type: boolean, description: Whether the endpoint is configured. }
        reachable: { type: boolean }
        healthy: { type: boolean }
        configured: { type: boolean }
        mock: { type: boolean }
        maxConcurrentJobs: { type: integer, minimum: 0 }
        activeJobs: { type: integer, minimum: 0 }
        queuedJobs: { type: integer, minimum: 0 }
        responseMs: { type: integer, minimum: 0 }
        reason: { type: string }
        message: { type: string }
    Integrations:
      type: object
      required: [simulator, robogo, storage]
      properties:
        simulator:
          type: object
          required: [browser, boardAgent, robogo, local]
          properties:
            browser: { type: object, additionalProperties: true }
            boardAgent: { type: object, additionalProperties: true }
            robogo: { type: object, additionalProperties: true }
            local: { $ref: "#/components/schemas/LocalWorkerIntegration" }
        robogo: { $ref: "#/components/schemas/RobogoIntegration" }
        storage: { $ref: "#/components/schemas/StorageIntegration" }
    RobogoIntegration:
      type: object
      required: [state, clusterQueried, devMachineQueried, message]
      properties:
        state: { type: string, enum: [ready, login_required, unavailable] }
        clusterQueried: { type: boolean }
        devMachineQueried: { type: boolean }
        availableBoardCount: { type: integer, minimum: 0 }
        developmentMachineCount: { type: integer, minimum: 0 }
        message: { type: string }
    StorageIntegration:
      type: object
      required: [mode, writable, message]
      properties:
        mode: { type: string, enum: [local-server, external-required] }
        writable: { type: boolean }
        message: { type: string }
    ValidationResponse:
      type: object
      required: [ok, validation]
      properties:
        ok: { const: true }
        validation: { type: object, additionalProperties: true }
        compatibility: { type: array, items: { $ref: "#/components/schemas/Compatibility" } }
    ModelResponse:
      type: object
      required: [ok, model]
      properties:
        ok: { const: true }
        model: { $ref: "#/components/schemas/Model" }
        compatibility: { type: array, items: { $ref: "#/components/schemas/Compatibility" } }
    RunResponse:
      type: object
      required: [ok, run]
      properties: { ok: { const: true }, run: { $ref: "#/components/schemas/Run" }, idempotentReplay: { type: boolean }, reconciled: { type: boolean } }
    TelemetryResponse:
      type: object
      required: [ok]
      properties: { ok: { const: true }, telemetry: { type: object, additionalProperties: true }, duplicate: { type: boolean }, acceptedSamples: { type: integer } }
    TelemetryListResponse:
      type: object
      required: [ok, runId, telemetry, count]
      properties: { ok: { const: true }, runId: { type: string }, telemetry: { type: array, items: { type: object, additionalProperties: true } }, count: { type: integer } }
    ReplayResponse:
      type: object
      required: [ok, runId, replay, evaluation]
      properties:
        ok: { const: true }
        runId: { type: string }
        replay: { type: object, additionalProperties: true }
        evaluation: { type: object, additionalProperties: true }
        # The replay endpoint returns the accepted raw samples for deterministic
        # frame seeking; keep this in the contract rather than relying on
        # additionalProperties.
        frames: { type: array, items: { $ref: "#/components/schemas/TelemetrySample" } }
    EvaluationResponse:
      type: object
      required: [ok, evaluation]
      properties:
        ok: { const: true }
        run: { $ref: "#/components/schemas/Run" }
        evaluation: { type: object, additionalProperties: true }
        evaluationRecord: { $ref: "#/components/schemas/EvaluationRecord" }
    DeploymentResponse:
      type: object
      required: [ok, deployment]
      properties: { ok: { const: true }, deployment: { $ref: "#/components/schemas/Deployment" }, idempotentReplay: { type: boolean } }
    PreflightResponse:
      type: object
      required: [ok, deployment, preflight]
      properties: { ok: { const: true }, deployment: { $ref: "#/components/schemas/Deployment" }, preflight: { type: object, additionalProperties: true } }
