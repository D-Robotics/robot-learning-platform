<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MicroDuck Sim2Real 两条训练路径</title>
  <desc id="desc">浏览器仿真和模型契约之后，训练请求可以进入本地 worker 或 RoboGo，再汇合到台账和 RDK 预检。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#11131a"/>
      <stop offset="1" stop-color="#1e1119"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7433"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" x2="1">
      <stop offset="0" stop-color="#ff2da2"/>
      <stop offset="1" stop-color="#b743ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff7433"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <g opacity=".15" fill="#ff7433">
    <circle cx="40" cy="35" r="2"/><circle cx="90" cy="35" r="2"/><circle cx="140" cy="35" r="2"/><circle cx="190" cy="35" r="2"/>
    <circle cx="40" cy="85" r="2"/><circle cx="90" cy="85" r="2"/><circle cx="140" cy="85" r="2"/><circle cx="190" cy="85" r="2"/>
    <circle cx="1030" cy="350" r="2"/><circle cx="1080" cy="350" r="2"/><circle cx="1130" cy="350" r="2"/>
  </g>
  <style>
    .box{fill:#191b22;stroke:#3e414d;stroke-width:2}.title{fill:#fff;font:700 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.sub{fill:#a6a9b5;font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.tag{fill:#ffb000;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px}.path{fill:none;stroke:#ff7433;stroke-width:4;marker-end:url(#arrow)}.path2{fill:none;stroke:#ff2da2;stroke-width:4;marker-end:url(#arrow)}
  </style>
  <g filter="url(#shadow)">
    <rect class="box" x="42" y="148" width="190" height="112" rx="16"/>
    <rect class="box" x="274" y="148" width="210" height="112" rx="16"/>
    <rect class="box" x="630" y="65" width="230" height="112" rx="16"/>
    <rect class="box" x="630" y="255" width="230" height="112" rx="16"/>
    <rect class="box" x="1000" y="148" width="158" height="112" rx="16"/>
  </g>
  <text class="tag" x="62" y="177">01 / SIMULATOR</text>
  <text class="title" x="62" y="211">MicroDuck 仿真</text>
  <text class="sub" x="62" y="237">官方浏览器策略</text>
  <text class="tag" x="294" y="177">02 / CONTRACT</text>
  <text class="title" x="294" y="211">一份模型契约</text>
  <text class="sub" x="294" y="237">61D → 14D · 50Hz</text>
  <text class="tag" x="650" y="94">03A / LOCAL</text>
  <text class="title" x="650" y="128">本地 worker</text>
  <text class="sub" x="650" y="154">当前：Mock · 无 CUDA</text>
  <text class="tag" x="650" y="284">03B / ROBOGO</text>
  <text class="title" x="650" y="318">RoboGo worker</text>
  <text class="sub" x="650" y="344">可选 · 显式计费</text>
  <text class="tag" x="1020" y="177">04 / CONTROL</text>
  <text class="title" x="1020" y="211">台账 + 预检</text>
  <text class="sub" x="1020" y="237">Canary → Live</text>
  <path class="path" d="M232 204H270"/>
  <path class="path" d="M484 204H570Q600 204 600 150H626"/>
  <path class="path2" d="M484 204H570Q600 204 600 310H626"/>
  <path class="path" d="M860 121H930Q960 121 960 204H996"/>
  <path class="path2" d="M860 311H930Q960 311 960 204H996"/>
  <text class="sub" x="505" y="186">local / RoboGo 分叉</text>
  <text class="sub" x="1000" y="292">网页不直接开电机</text>
</svg>
