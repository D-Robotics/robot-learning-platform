name: Windows 0.6.8 public ZIP smoke
on: push
permissions:
  contents: read
jobs:
  public-zip:
    name: Windows x64 · ${{ matrix.mode }}
    runs-on: windows-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        mode: [download-node]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node check.mjs ${{ matrix.mode }}
        shell: cmd
