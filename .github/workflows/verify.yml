name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The verify chain runs 18 assertion scripts plus vitest and a release
    # build; a cold npm ci and python probes add minutes on shared runners.
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify contracts, UI wiring, and deployment assets
        run: npm run verify
      # `npm run verify` already ends with `npm run build`; keep a standalone
      # type-check pass (no emit) as a fast signal without repeating the build.
      - name: Type-check
        run: npx tsc -p tsconfig.build.json --noEmit
