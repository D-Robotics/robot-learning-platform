name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

# The old single job ran the whole 60-step chain serially on both Node
# versions (~45 minutes per push). These jobs run the same assertions in
# parallel, grouped by what they need installed; `npm run verify` keeps its
# local serial semantics unchanged. Every job below must stay green - the
# `summary` job is the aggregate anchor for branch protection.

jobs:
  static:
    name: static (format, lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Static gates
        run: npm run verify:ci:static

  contracts:
    name: contracts (static gates, both runtimes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Install lightweight Python parity dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.0.2
      - name: Contract and UI wiring gates
        run: npm run verify:ci:contracts
      - name: Python parity contracts
        run: npm run verify:ci:python-contracts

  engines:
    name: engines (real training rounds)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Set up Python for engine wheels
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python training stacks (CPU)
        # Engine gates used to SKIP on CI (numpy only); a real training round
        # per engine is worth the wheel download. CPU wheels keep it small.
        # The engine and board contract checks select the TorchScript ONNX
        # exporter explicitly to preserve their validated graph contracts.
        # Keep torchvision 0.24 aligned with torch 2.9 when dm_control
        # pulls torchvision in the follow-up install.
        # JAX 0.11 needs numpy>=2.1; use the MJX input pin explicitly rather
        # than letting the final install silently upgrade an older NumPy.
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.5.3
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.9.0 torchvision==0.24.0
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "torch==2.9.0" "torchvision==0.24.0" \
            onnx==1.23.2 onnxruntime==1.30.0 "jax[cpu]==0.11.1" \
            "mujoco==3.13.0" "mujoco-mjx==3.13.0" "optax==0.2.8" \
            "dm_control==1.0.46" rsl-rl-lib==2.2.3 pytest
      - name: Engine gates
        env:
          RDK_MJX_ENGINE_REQUIRED: '1'
        run: |
          python3 engines/mjx-adapter/test_mjx_adapter.py DependencyRefusalTests
          npm run verify:ci:engines

  agents:
    name: agents (worker, board, artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Install lightweight Python parity dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.0.2
      - name: Agent and artifact gates
        run: npm run verify:ci:agents

  build-e2e:
    name: build + api contract + e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Build, contract and end-to-end smoke gates
        run: npm run verify:ci:build-e2e
      - name: Validate systemd units
        run: VERIFY_SYSTEMD=1 npm run verify:deployment

  unit:
    name: unit (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Unit tests
        run: npm test

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Coverage gate
        # Thresholds are the measured baselines recorded in the vitest config;
        # a coverage drop fails here, not in review.
        run: npm run test:coverage

  audits:
    name: dependency audits + release security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Production dependency audit
        # Keep the production gate separate from the tooling graph so its
        # scope stays obvious.
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit
        run: npm audit --audit-level=moderate
      - name: Public release security scan
        run: npm run verify:security

  windows-plugin:
    name: Windows plugin installer and MCP
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the Windows installer, Qoder ZIP and DPAPI checks
        run: node --test scripts/plugin-windows.test.mjs scripts/plugin-install.test.mjs scripts/plugin-qoder-import.test.mjs

  summary:
    name: verify summary
    needs:
      - static
      - contracts
      - engines
      - agents
      - build-e2e
      - unit
      - coverage
      - audits
      - windows-plugin
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        run: |
          if [ "${{ needs.static.result }}" != "success" ] \
            || [ "${{ needs.contracts.result }}" != "success" ] \
            || [ "${{ needs.engines.result }}" != "success" ] \
            || [ "${{ needs.agents.result }}" != "success" ] \
            || [ "${{ needs.build-e2e.result }}" != "success" ] \
            || [ "${{ needs.unit.result }}" != "success" ] \
            || [ "${{ needs.coverage.result }}" != "success" ] \
            || [ "${{ needs.audits.result }}" != "success" ] \
            || [ "${{ needs.windows-plugin.result }}" != "success" ]; then
            echo "one or more verify jobs failed:"
            echo "  static:    ${{ needs.static.result }}"
            echo "  contracts: ${{ needs.contracts.result }}"
            echo "  engines:   ${{ needs.engines.result }}"
            echo "  agents:    ${{ needs.agents.result }}"
            echo "  build-e2e: ${{ needs.build-e2e.result }}"
            echo "  unit:      ${{ needs.unit.result }}"
            echo "  coverage:  ${{ needs.coverage.result }}"
            echo "  audits:    ${{ needs.audits.result }}"
            echo "  windows:   ${{ needs.windows-plugin.result }}"
            exit 1
          fi
          echo "all verify jobs passed"
