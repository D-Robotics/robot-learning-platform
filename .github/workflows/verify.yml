name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The verify chain runs 20+ assertion scripts plus vitest and a release
    # build; a cold npm ci and python probes add minutes on shared runners.
    # The Node matrix runs this job three times, so keep healthy headroom.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is retired: the DSH session-persistence dependency imports
        # node:zlib zstd helpers statically, which only exist on Node 22+.
        node-version: [22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Install lightweight Python parity dependency
        # Several reward/environment contract tests execute the NumPy-backed
        # reference environment. Heavy training stacks remain optional and
        # keep their explicit SKIP/guard behavior.
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.0.2
      - name: Lint
        # Warnings are release debt in a mature product; keep CI aligned with
        # the repository's local gate so a new warning cannot quietly merge.
        run: npm run lint -- --max-warnings=0
      - name: Format
        run: npm run format:check
      - name: Verify contracts, UI wiring, and deployment assets
        run: npm run verify
      - name: Validate systemd units
        # Ubuntu runners provide systemd-analyze; keep the repository's local
        # macOS workflow usable while making the Linux deployment syntax a CI
        # release gate.
        run: VERIFY_SYSTEMD=1 npm run verify:deployment
      - name: Coverage gate
        if: matrix.node-version == 22
        run: npm run test:coverage
      - name: Production dependency audit
        if: matrix.node-version == 22
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit
        if: matrix.node-version == 22
        # Keep the test/tooling graph clean as well; this is intentionally
        # separate from the production gate so its scope remains obvious.
        run: npm audit --audit-level=moderate
      - name: Public release security scan
        if: matrix.node-version == 22
        run: npm run verify:security
      # `npm run verify` already ends with `npm run build`; keep a standalone
      # type-check pass (no emit) as a fast signal without repeating the build.
      - name: Type-check
        run: npx tsc -p tsconfig.build.json --noEmit
