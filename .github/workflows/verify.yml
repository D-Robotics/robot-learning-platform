name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The verify chain runs 20+ assertion scripts plus vitest and a release
    # build; a cold npm ci and python probes add minutes on shared runners.
    # The Node matrix runs this job three times, so keep healthy headroom.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Verify contracts, UI wiring, and deployment assets
        run: npm run verify
      # `npm run verify` already ends with `npm run build`; keep a standalone
      # type-check pass (no emit) as a fast signal without repeating the build.
      - name: Type-check
        run: npx tsc -p tsconfig.build.json --noEmit
