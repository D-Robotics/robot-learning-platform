<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OriginMan 舞蹈 Workshop · RDK Robot Learning</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./experiment.css" />
    <link rel="stylesheet" href="./workshop.css" />
    <script type="module" src="./workshop-entry-page.mjs?v=dance"></script>
  </head>
  <body>
    <a class="skip-link" id="workshop-skip" href="#dance-workshop-main">跳到 Workshop 内容</a>
    <header class="experiment-header">
      <a href="./">RDK Robot Learning</a>
    </header>
    <main id="dance-workshop-main" class="workshop-shell">
      <h1>OriginMan 舞蹈 Workshop</h1>
      <p>第一次来？先看摆臂示意，再去配置快检。</p>
      <section id="dance-reference" aria-labelledby="dance-reference-title">
        <h2 id="dance-reference-title">看一段交替摆臂</h2>
        <figure>
          <canvas id="dance-reference-canvas" width="640" height="260" hidden role="img" aria-label="交替摆臂动作示意。左、右手轮流向前。"></canvas>
          <figcaption>动作示意 · 100 BPM · 8 拍。每拍左右手交换一次。此处展示编排目标，实际动作可在训练回放中查看。</figcaption>
        </figure>
        <button id="dance-reference-play" type="button" hidden>播放动作示意</button>
        <button id="dance-reference-stop" type="button" hidden>停止示意</button>
        <p id="dance-reference-status" role="status"></p>
      </section>
      <section aria-labelledby="dance-budget-title">
        <h2 id="dance-budget-title">选这轮训练多久</h2>
        <div class="workshop-current">
          <div>
            <h3>快检 · 8,192 步</h3>
            <p>第一次选这档。练习从提交训练到看回放、下载策略。</p>
            <a id="dance-budget-quick" class="workshop-action-primary" href="./?robot=originman&amp;danceBudget=quick#train/configure">配置快检</a>
          </div>
          <div>
            <h3>正式实验 · 50 万步</h3>
            <p>想比较不同舞段或参数的效果时选这档。效果看本轮评测。</p>
            <a id="dance-budget-formal" href="./?robot=originman&amp;danceBudget=formal#train/configure">配置正式实验</a>
          </div>
        </div>
        <p>选择一档会打开训练配置页。两档默认同时运行 64 个仿真场景。到提交页确认后才会开始训练。</p>
        <div class="workshop-actions">
          <a href="./?robot=originman#train/submit">查看训练记录</a>
          <a href="./originman-reference.html">打开参考轨迹跟跳</a>
        </div>
      </section>
    </main>
  </body>
</html>
