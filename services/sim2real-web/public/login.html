<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>登录 · RDK Robot Learning Platform</title>
<link rel="stylesheet" href="/tokens.css?v=2">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background:
      radial-gradient(1100px 500px at 20% -10%, color-mix(in srgb, #2f7df6 16%, transparent), transparent),
      var(--bg, #f5f6f8);
    color: var(--text, #17202b);
  }
  .card {
    width: min(400px, calc(100vw - 32px));
    padding: 32px 28px 26px;
    border: 1px solid var(--line-strong, #d8dde5);
    border-radius: 16px;
    background: var(--panel, #fff);
    box-shadow: 0 12px 40px rgba(15, 25, 40, .08);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    background: var(--accent, #2f7df6); color: #fff; font-weight: 700; font-size: 15px;
  }
  .brand-name { font-size: 14px; letter-spacing: .08em; color: var(--muted-strong, #5a6673); font-weight: 600; }
  h1 { font-size: 20px; margin: 14px 0 4px; }
  .sub { margin: 0 0 20px; color: var(--muted, #71808f); font-size: 13px; }
  label { display: block; font-size: 12px; color: var(--muted-strong, #5a6673); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; border-radius: 9px;
    border: 1px solid var(--line-strong, #d8dde5); background: var(--panel, #fff); color: inherit;
  }
  input:focus { outline: 2px solid var(--accent, #2f7df6); outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; margin-top: 20px; padding: 11px 14px; font: inherit; font-weight: 600;
    border: 0; border-radius: 9px; background: var(--accent, #2f7df6); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  .error {
    display: none; margin: 0 0 4px; padding: 9px 12px; border-radius: 9px; font-size: 13px;
    border: 1px solid color-mix(in srgb, #c0392b 45%, transparent);
    background: color-mix(in srgb, #c0392b 10%, transparent); color: #a93226;
  }
  .sso { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line, #e3e7ec); text-align: center; }
  .sso a { color: var(--accent, #2f7df6); font-size: 13px; text-decoration: none; }
  .sso a:hover { text-decoration: underline; }
  .foot { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted, #8a95a1); }
  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(1100px 500px at 20% -10%, rgba(74, 144, 255, .14), transparent), #10151c; }
  }
</style>
</head>
<body>
<main class="card" aria-labelledby="login-title">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">D</span>
    <span class="brand-name">RDK ROBOT LEARNING PLATFORM</span>
  </div>
  <h1 id="login-title">登录工作台</h1>
  <p class="sub">使用 User Center 账号登录机器人学习工作台。</p>
  <p class="error" id="error" role="alert"></p>
  <form id="form" method="post" action="#" autocomplete="on">
    <label for="userName">账号</label>
    <input id="userName" name="userName" type="text" required autocomplete="username" spellcheck="false">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit" id="submit">登录</button>
  </form>
  <p class="sso"><a id="sso-link" href="/api/sim2real/auth/uc/login">使用企业 SSO 授权登录 →</a></p>
  <p class="foot">RDK Robot Learning Platform · Robot Learning Workbench</p>
</main>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var returnTo = params.get('returnTo') || '/';
  if (!returnTo.startsWith('/') || returnTo.startsWith('//')) returnTo = '/';
  var form = document.getElementById('form');
  var error = document.getElementById('error');
  var button = document.getElementById('submit');
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    error.style.display = 'none';
    button.disabled = true;
    button.textContent = '登录中…';
    fetch('/api/sim2real/auth/uc/session', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        userName: document.getElementById('userName').value.trim(),
        password: document.getElementById('password').value,
      }),
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (body) {
        return { ok: response.ok, body: body };
      });
    }).then(function (result) {
      if (result.ok && result.body && result.body.ok !== false) {
        var target = returnTo;
        window.location.assign(target);
        return;
      }
      error.textContent = (result.body && result.body.message) || '账号或密码不正确。';
      error.style.display = 'block';
      button.disabled = false;
      button.textContent = '登录';
    }).catch(function () {
      error.textContent = '登录服务暂时不可用，请稍后重试。';
      error.style.display = 'block';
      button.disabled = false;
      button.textContent = '登录';
    });
  });
})();
</script>
</body>
</html>
