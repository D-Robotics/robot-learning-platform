[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdk-robot-learning"
version = "0.1.0"
description = "Python SDK and CLI for the RDK Robot Learning Platform"
requires-python = ">=3.10"

[project.scripts]
rdk-lab = "rdk_robot_learning.cli:main"

[tool.setuptools.packages.find]
where = ["."]
